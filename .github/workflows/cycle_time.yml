name: Weekly Cycle Time Report

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 8am UTC (9am Lisbon in winter, 10am in summer)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dateutil openpyxl

      - name: Run Weekly Cycle Time Report (last 12 weeks)
        run: python cycle_time.py
        env:
          JIRA_EMAIL:        ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:    ${{ secrets.JIRA_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
